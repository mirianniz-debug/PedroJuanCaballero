<style>
  /* ============ CORES E FONTES (identidade Niz) ============ */
  :root{
    --paper:#f2f1e8; --panel:#fbfaf3; --header-bg:#2f3d2b; --header-text:#f2f1e8;
    --moss:#3e5a3a; --moss-2:#6e8b4e; --sage:#b9c4a3; --clay:#b9744a; --clay-soft:#d19468;
    --water:#5e8583; --ink:#2e2a22; --ink-soft:#6a6252; --line:#e1dccb; --line-strong:#c9c2a8;
    --py:#c4762f; --br:#0b7398; --card:#ffffff;
    --font-display:'Young Serif', Georgia, serif; --font-body:'Hanken Grotesk', system-ui, sans-serif;
  }
  @media (prefers-color-scheme: dark){
    :root:not([data-theme="light"]){
      --paper:#171d16; --panel:#1d241c; --header-bg:#121811; --header-text:#e9e7da;
      --moss:#a9c294; --moss-2:#8fae74; --sage:#56644b; --clay:#d8956a; --clay-soft:#e3ad86;
      --water:#86aaa7; --ink:#ebe8dc; --ink-soft:#b3ad9a; --line:#2f3a2d; --line-strong:#43503f;
      --py:#c4762f; --br:#1f8fb0; --card:#232b21;
    }
  }
  :root[data-theme="dark"]{
    --paper:#171d16; --panel:#1d241c; --header-bg:#121811; --header-text:#e9e7da;
    --moss:#a9c294; --moss-2:#8fae74; --sage:#56644b; --clay:#d8956a; --clay-soft:#e3ad86;
    --water:#86aaa7; --ink:#ebe8dc; --ink-soft:#b3ad9a; --line:#2f3a2d; --line-strong:#43503f;
    --py:#c4762f; --br:#1f8fb0; --card:#232b21;
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;height:100%;font-family:var(--font-body);background:var(--paper);color:var(--ink);}
  #app{display:flex;height:100vh;height:100dvh;width:100%;}
  #map{flex:1;height:100%;background:#1a2015;position:relative;}

  /* ============ PAINEL LATERAL ============ */
  #panel{width:390px;min-width:390px;background:var(--panel);border-left:1px solid var(--line-strong);display:flex;flex-direction:column;height:100%;overflow:hidden;}
  #panel-header{padding:18px 20px 14px;background:var(--header-bg);color:var(--header-text);}
  #logo-row{display:flex;align-items:center;gap:12px;}
  #site-logo{width:42px;height:42px;flex-shrink:0;}
  #panel-header h1{font-family:var(--font-display);font-weight:400;font-size:19px;line-height:1.2;margin:0;}
  #panel-header .sub{font-size:12.5px;opacity:.82;margin:3px 0 0;}
  #btn-row{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-top:12px;}
  .mini-btn{background:none;border:1px solid rgba(242,241,232,.35);color:var(--header-text);font:600 11.5px var(--font-body);padding:5px 11px;border-radius:20px;cursor:pointer;}
  .mini-btn:hover,.mini-btn[aria-expanded="true"]{background:rgba(242,241,232,.12);}
  .lang{margin-left:auto;display:flex;border:1px solid rgba(242,241,232,.35);border-radius:20px;overflow:hidden;}
  .lang button{background:none;border:none;color:var(--header-text);font:700 11px var(--font-body);padding:5px 10px;cursor:pointer;opacity:.75;}
  .lang button.active{background:var(--header-text);color:var(--header-bg);opacity:1;}
  .info-box{display:none;background:rgba(255,255,255,.07);border-radius:10px;padding:11px 13px;margin-top:10px;font-size:12px;line-height:1.55;max-height:46vh;overflow:auto;}
  .info-box.show{display:block;}
  .info-box b{color:#fff;}
  .info-box p{margin:0 0 7px;}
  .info-box a{color:var(--clay-soft);}
  #tabs{display:flex;border-bottom:1px solid var(--line);flex-shrink:0;background:var(--paper);}
  .tab-btn{flex:1;padding:11px 4px;background:none;border:none;color:var(--ink-soft);font:600 12.5px var(--font-body);cursor:pointer;border-bottom:3px solid transparent;}
  .tab-btn.active{color:var(--moss);border-bottom-color:var(--clay);}
  .tab-btn .soon{display:block;font-size:9.5px;font-weight:500;opacity:.7;}
  #panel-body{flex:1;overflow-y:auto;padding:16px 18px 24px;}
  .tab-pane{display:none;} .tab-pane.active{display:block;}
  h2{font-family:var(--font-display);font-weight:400;font-size:20px;line-height:1.25;margin:2px 0 8px;color:var(--ink);}
  h3{font-family:var(--font-display);font-weight:400;font-size:15px;margin:20px 0 8px;color:var(--moss);}
  .lead{font-size:13.5px;line-height:1.6;color:var(--ink-soft);margin:0 0 10px;}
  .lead b{color:var(--ink);}
  .note{font-size:11.5px;line-height:1.5;color:var(--ink-soft);background:var(--paper);border-left:3px solid var(--line-strong);padding:7px 10px;border-radius:0 8px 8px 0;margin:8px 0;}
  .action-btn{display:inline-flex;align-items:center;gap:6px;background:var(--moss);color:var(--panel);border:none;font:600 12px var(--font-body);padding:8px 14px;border-radius:20px;cursor:pointer;margin:4px 6px 4px 0;}
  .action-btn.ghost{background:none;color:var(--moss);border:1px solid var(--line-strong);}
  .action-btn:hover{filter:brightness(1.08);}

  /* comparação PY x BR (cada lado no seu idioma) */
  .compare{border:1px solid var(--line);border-radius:12px;overflow:hidden;background:var(--card);}
  .compare .row{display:grid;grid-template-columns:1fr 1fr;border-top:1px solid var(--line);}
  .compare .row:first-child{border-top:none;}
  .compare .cell{padding:8px 12px 9px;}
  .compare .cell + .cell{border-left:1px solid var(--line);}
  .compare .head .cell{font-family:var(--font-display);font-size:14px;}
  .compare .head small{display:block;font-family:var(--font-body);font-size:10.5px;color:var(--ink-soft);}
  .compare .head .py{color:var(--py);} .compare .head .br{color:var(--br);}
  .compare .clbl{font-size:11px;color:var(--ink-soft);margin-bottom:1px;}
  .compare .val{font-size:17px;font-weight:700;font-variant-numeric:tabular-nums;}
  .compare .unit{font-size:11px;font-weight:500;color:var(--ink-soft);margin-left:3px;}
  .bar{height:5px;border-radius:3px;background:var(--line);margin-top:5px;overflow:hidden;}
  .bar span{display:block;height:100%;border-radius:3px;}
  .src{font-size:10.5px;color:var(--ink-soft);margin-top:6px;line-height:1.45;}

  /* lista de camadas = legenda */
  .layer{display:flex;align-items:flex-start;gap:10px;padding:8px 4px;border-bottom:1px dashed var(--line);cursor:pointer;}
  .layer input{margin:3px 0 0;accent-color:var(--moss);width:15px;height:15px;flex-shrink:0;cursor:pointer;}
  .layer .txt{flex:1;}
  .layer .name{font-size:13px;font-weight:600;}
  .layer .meta{font-size:11px;color:var(--ink-soft);margin-top:1px;line-height:1.4;}
  .key{display:flex;flex-wrap:wrap;gap:4px 10px;margin-top:4px;font-size:11px;color:var(--ink-soft);}
  .key i{display:inline-block;width:12px;height:9px;border-radius:2px;margin-right:4px;vertical-align:-1px;}
  .key i.ln{height:0;border-top:3px solid;border-radius:0;vertical-align:3px;}
  .layer-group{border-bottom:1px dashed var(--line);}
  .layer-group > .layer{border-bottom:none;}
  .sublayers{padding:0 4px 8px 29px;display:grid;gap:2px;}
  .sub{display:flex;align-items:center;gap:8px;font-size:12.5px;padding:4px 0;cursor:pointer;}
  .sub input{accent-color:var(--moss);width:14px;height:14px;margin:0;cursor:pointer;}
  .sub .dot{display:inline-block;width:10px;height:10px;border-radius:50%;border:1.5px solid #fff;box-shadow:0 0 0 1px var(--line-strong);flex-shrink:0;}
  .sub .cnt{margin-left:auto;font-size:10.5px;color:var(--ink-soft);font-variant-numeric:tabular-nums;}

  /* lista de territórios */
  .search-box{width:100%;padding:9px 12px;border-radius:9px;border:1px solid var(--line-strong);background:var(--card);color:var(--ink);font:14px var(--font-body);margin-bottom:10px;}
  .search-box:focus{outline:2px solid var(--clay);outline-offset:0;border-color:transparent;}
  .t-item{padding:10px 12px;border-radius:10px;margin-bottom:6px;cursor:pointer;border:1px solid var(--line);background:var(--card);}
  .t-item:hover{border-color:var(--clay-soft);}
  .t-item.selected{border-color:var(--clay);box-shadow:0 0 0 1px var(--clay) inset;}
  .t-item .name{font-size:13.5px;font-weight:700;}
  .t-item .meta{font-size:11.5px;color:var(--ink-soft);margin-top:2px;}
  .flag{display:inline-block;font-size:10px;font-weight:700;padding:1px 6px;border-radius:8px;color:#fff;margin-left:6px;vertical-align:1px;}
  .flag.py{background:var(--py);} .flag.br{background:var(--br);}

  .soon-box{border:1px dashed var(--line-strong);border-radius:12px;padding:16px;color:var(--ink-soft);font-size:13px;line-height:1.55;}

  #map-credit{padding:8px 20px;font-size:11px;color:var(--ink-soft);border-top:1px solid var(--line);background:var(--panel);display:flex;justify-content:space-between;gap:10px;}
  #theme-btn{background:none;border:none;color:var(--ink-soft);cursor:pointer;font:600 11px var(--font-body);padding:0;}

  /* ============ CONTROLES SOBRE O MAPA ============ */
  #basemap-toggle{position:absolute;top:12px;right:12px;z-index:500;background:var(--panel);border:1px solid var(--line-strong);border-radius:20px;padding:3px;display:flex;gap:2px;box-shadow:0 2px 10px rgba(0,0,0,.25);}
  #basemap-toggle button{border:none;background:none;padding:6px 11px;border-radius:16px;font:600 11.5px var(--font-body);cursor:pointer;color:var(--ink-soft);}
  #basemap-toggle button.active{background:var(--moss);color:var(--panel);}
  #loading{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;background:var(--paper);color:var(--ink-soft);font-family:var(--font-display);font-size:15px;z-index:1000;}
  .country-label{font-family:var(--font-display);font-size:22px;white-space:nowrap;text-shadow:0 0 4px #fff,0 0 10px #fff,0 0 2px #fff;pointer-events:none;}
  .country-label.py{color:#8a4f2b;} .country-label.br{color:#0b5470;}
  .leaflet-popup-content-wrapper{background:var(--panel);color:var(--ink);border-radius:12px;font-family:var(--font-body);}
  .leaflet-popup-tip{background:var(--panel);}
  .leaflet-popup-content{margin:12px 14px;min-width:190px;}
  .pp-title{font-family:var(--font-display);font-size:15px;margin-bottom:4px;color:var(--ink);}
  .pp-row{font-size:12px;color:var(--ink-soft);margin:2px 0;}
  .pp-row b{color:var(--ink);font-weight:600;}
  .pp-src{font-size:10.5px;color:var(--ink-soft);margin-top:6px;border-top:1px solid var(--line);padding-top:5px;}
  .leaflet-tooltip.road-tip{font:600 11px var(--font-body);}

  /* cortina (swipe) */
  #swipe-divider{position:absolute;top:0;bottom:0;width:0;z-index:450;display:none;}
  #swipe-divider::before{content:"";position:absolute;top:0;bottom:0;left:-1.5px;width:3px;background:#fff;box-shadow:0 0 6px rgba(0,0,0,.5);}
  #swipe-handle{position:absolute;top:50%;left:-21px;width:42px;height:42px;margin-top:-21px;border-radius:50%;background:var(--clay);color:#fff;border:3px solid #fff;display:flex;align-items:center;justify-content:center;font-size:17px;cursor:ew-resize;touch-action:none;box-shadow:0 2px 8px rgba(0,0,0,.4);user-select:none;}
  .swipe-tag{position:absolute;bottom:30px;z-index:450;background:rgba(30,36,28,.82);color:#fff;font:600 11.5px var(--font-body);padding:4px 10px;border-radius:12px;display:none;pointer-events:none;}
  #swipe-tag-l{left:12px;} #swipe-tag-r{right:12px;}
  .swipe-on #swipe-divider,.swipe-on .swipe-tag{display:block;}
  select.field{width:100%;padding:8px 10px;border-radius:9px;border:1px solid var(--line-strong);background:var(--card);color:var(--ink);font:13px var(--font-body);margin:4px 0 8px;}
  .switch-row{display:flex;align-items:center;gap:8px;font-size:13px;font-weight:600;margin:6px 0;}
  .switch-row input{accent-color:var(--clay);width:16px;height:16px;}
  .swipe-box{background:var(--paper);border:1px solid var(--line);border-radius:12px;padding:12px 12px 8px;}
  .steps{margin:0 0 10px;padding-left:20px;font-size:12.5px;line-height:1.55;color:var(--ink-soft);}
  .steps b{color:var(--ink);}
  .two-sel{display:grid;grid-template-columns:1fr 1fr;gap:8px;}
  .two-sel label{font-size:11.5px;color:var(--ink-soft);font-weight:600;}
  .two-sel select{margin-top:3px;}

  /* linha do tempo */
  .year-box{display:flex;align-items:center;gap:12px;}
  .play{width:44px;height:44px;border-radius:50%;border:none;background:var(--clay);color:#fff;font-size:16px;cursor:pointer;flex-shrink:0;}
  .year-main{flex:1;min-width:0;}
  .year{font-family:var(--font-display);font-size:30px;line-height:1;color:var(--ink);font-variant-numeric:tabular-nums;}
  #ano{width:100%;accent-color:var(--clay);margin:6px 0 2px;}
  .ramp{display:flex;align-items:center;gap:6px;font-size:10.5px;color:var(--ink-soft);}
  .ramp i{flex:1;height:8px;border-radius:4px;}
  .chart-legend{display:flex;gap:14px;font-size:12px;color:var(--ink-soft);margin-bottom:4px;}
  .chart-legend i{display:inline-block;width:14px;height:3px;border-radius:2px;margin-right:6px;vertical-align:3px;}
  .chart{position:relative;}
  .chart svg{display:block;width:100%;height:auto;overflow:visible;}
  .chart .grid{stroke:var(--line);stroke-width:1;}
  .chart .axis{fill:var(--ink-soft);font:11px var(--font-body);}
  .chart .end{fill:var(--ink);font:600 11px var(--font-body);}
  .chart .cursor{stroke:var(--ink-soft);stroke-width:1;}
  .chart-tip{position:absolute;pointer-events:none;background:var(--card);border:1px solid var(--line-strong);border-radius:8px;padding:6px 9px;font-size:11.5px;box-shadow:0 2px 8px rgba(0,0,0,.15);white-space:nowrap;display:none;color:var(--ink);}
  .chart-tip i{display:inline-block;width:9px;height:9px;border-radius:50%;margin-right:5px;}
  details.tbl{font-size:12px;margin:6px 0;}
  details.tbl summary{cursor:pointer;color:var(--moss);font-weight:600;}
  details.tbl table{border-collapse:collapse;width:100%;margin-top:6px;font-variant-numeric:tabular-nums;}
  details.tbl th,details.tbl td{padding:3px 6px;border-bottom:1px solid var(--line);text-align:right;}
  details.tbl th:first-child,details.tbl td:first-child{text-align:left;}

  /* toques afetivos: bandeiras, ñandutí, costumes */
  .flag-svg{display:inline-block;width:20px;height:14px;vertical-align:-2px;border-radius:2px;box-shadow:0 0 0 .5px rgba(0,0,0,.25);}
  .flags{display:inline-flex;gap:4px;margin-left:8px;vertical-align:-1px;}
  #panel-header{position:relative;overflow:hidden;}
  #panel-header > *{position:relative;}
  #panel-header .watermark{position:absolute;right:-46px;top:-42px;width:170px;height:170px;color:var(--header-text);opacity:.13;pointer-events:none;}
  #loading .spin{animation:girar 9s linear infinite;color:var(--ink-soft);}
  #loading .box{display:flex;flex-direction:column;align-items:center;gap:12px;}
  @keyframes girar{to{transform:rotate(360deg);}}
  @media (prefers-reduced-motion: reduce){ #loading .spin{animation:none;} }
  .costumes{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:4px;}
  .costumes .col{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:10px 10px 6px;}
  .costumes .col.py{border-top:3px solid var(--py);} .costumes .col.br{border-top:3px solid var(--br);}
  .costumes .ch{font-family:var(--font-display);font-size:14px;display:flex;align-items:center;gap:6px;margin-bottom:6px;}
  .costumes .item{display:grid;grid-template-columns:40px 1fr;gap:8px;align-items:center;padding:5px 0;border-top:1px dashed var(--line);}
  .costumes .item:first-of-type{border-top:none;}
  .costumes .item svg{width:40px;height:40px;color:var(--ink-soft);}
  .costumes .nm{font-size:12.5px;font-weight:700;}
  .costumes .ds{font-size:10.5px;color:var(--ink-soft);line-height:1.35;}
  .costumes .cn{font-size:10.5px;color:var(--ink-soft);font-style:italic;margin:4px 0 2px;}
  .sub .sd{display:block;font-size:10.5px;color:var(--ink-soft);font-weight:400;}
  .sub .st{display:flex;flex-direction:column;}
  .country-label .flag-svg{width:24px;height:16px;margin-right:6px;vertical-align:1px;}

  /* memória e cultura */
  .chips{display:flex;flex-wrap:wrap;gap:6px;margin:6px 0 12px;}
  .chip{border:1px solid var(--line-strong);background:var(--card);color:var(--ink-soft);font:600 12px var(--font-body);padding:5px 11px;border-radius:16px;cursor:pointer;display:inline-flex;align-items:center;gap:5px;}
  .chip svg{width:14px;height:14px;}
  .chip.active{background:var(--moss);border-color:var(--moss);color:var(--panel);}
  .mem-item{display:grid;grid-template-columns:56px 1fr;gap:10px;align-items:center;padding:8px;border:1px solid var(--line);border-radius:12px;background:var(--card);margin-bottom:8px;cursor:pointer;}
  .mem-item:hover{border-color:var(--clay-soft);}
  .mem-thumb{width:56px;height:56px;border-radius:10px;overflow:hidden;background:var(--paper);display:flex;align-items:center;justify-content:center;color:var(--ink-soft);}
  .mem-thumb img{width:100%;height:100%;object-fit:cover;}
  .mem-item .nm{font-size:13.5px;font-weight:700;line-height:1.3;}
  .mem-item .mt{font-size:11.5px;color:var(--ink-soft);margin-top:2px;display:flex;align-items:center;gap:6px;flex-wrap:wrap;}
  .tag-ex{font-size:10px;font-weight:700;color:var(--clay);border:1px dashed var(--clay);border-radius:8px;padding:0 6px;}
  .mem-pin{width:32px;height:32px;border-radius:50% 50% 50% 0;transform:rotate(-45deg);background:var(--c);border:2.5px solid #fff;box-shadow:0 2px 6px rgba(0,0,0,.4);display:flex;align-items:center;justify-content:center;}
  .mem-pin svg{transform:rotate(45deg);width:17px;height:17px;}
  .mem-pin.ex{border-style:dashed;}
  .mem-popup .leaflet-popup-content-wrapper{padding:0;overflow:hidden;}
  .mem-popup .leaflet-popup-content{margin:0;width:270px !important;}
  .mem-popup .leaflet-popup-scrolled{border:none;}
  .mem-photo{height:150px;background:var(--paper);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:6px;color:var(--ink-soft);font-size:11.5px;position:relative;}
  .mem-photo img{width:100%;height:100%;object-fit:cover;display:block;}
  .mem-photo .tag-ex{position:absolute;top:10px;left:10px;background:var(--panel);}
  .mem-body{padding:12px 14px 14px;}
  .mem-chip{display:inline-flex;align-items:center;gap:5px;font:700 11px var(--font-body);color:#fff;background:var(--c);padding:3px 9px;border-radius:12px;}
  .mem-chip svg{width:13px;height:13px;}
  .mem-title{font-family:var(--font-display);font-size:17px;line-height:1.25;margin:8px 0 2px;color:var(--ink);}
  .mem-ano{font-size:12px;color:var(--clay);font-weight:700;}
  .mem-body p{font-size:13px;line-height:1.55;color:var(--ink-soft);margin:6px 0 0;}
  .mem-cred{font-size:10.5px;color:var(--ink-soft);margin-top:6px;line-height:1.4;}
  .mem-cred a{color:var(--moss);}

  /* janelas sobre o mapa (números e costumes) */
  .map-cards{position:absolute;left:12px;bottom:30px;z-index:520;display:flex;gap:8px;flex-wrap:wrap;}
  .map-card-btn{position:relative;display:inline-flex;align-items:center;gap:7px;background:var(--panel);color:var(--ink);border:1px solid var(--line-strong);border-radius:22px;padding:6px 14px 6px 8px;font:700 12.5px var(--font-body);cursor:pointer;box-shadow:0 2px 10px rgba(0,0,0,.28);}
  .map-card-btn:hover,.map-card-btn[aria-expanded="true"]{border-color:var(--clay);}
  .map-card-btn .mcb-ic{display:inline-flex;}
  .map-card-btn .mcb-ic svg{width:26px;height:26px;}
  .map-card-btn .pulse{position:absolute;top:-3px;right:-3px;width:11px;height:11px;border-radius:50%;background:var(--clay);border:2px solid var(--panel);}
  .map-card-btn .pulse::after{content:"";position:absolute;inset:-2px;border-radius:50%;border:2px solid var(--clay);animation:pulsar 1.8s ease-out infinite;}
  .map-card-btn.visto .pulse{display:none;}
  @keyframes pulsar{from{transform:scale(1);opacity:.9;}to{transform:scale(2.6);opacity:0;}}
  @media (prefers-reduced-motion: reduce){ .map-card-btn .pulse::after{animation:none;} }
  .map-overlay{position:absolute;left:12px;bottom:78px;z-index:1100;width:380px;max-width:calc(100% - 24px);max-height:calc(100% - 100px);overflow:auto;background:var(--panel);color:var(--ink);border:1px solid var(--line-strong);border-radius:14px;padding:14px 16px 12px;box-shadow:0 8px 28px rgba(0,0,0,.35);}
  .map-overlay[hidden]{display:none;}
  .map-overlay h3{margin:0 28px 10px 0;}
  .ov-close{position:absolute;top:8px;right:10px;border:none;background:none;font-size:22px;line-height:1;color:var(--ink-soft);cursor:pointer;padding:4px;}
  .swipe-on .map-cards,.swipe-on .map-overlay{display:none;}
  .cos-shared{background:var(--card);border:1px solid var(--line);border-top:3px solid var(--clay);border-radius:12px;padding:10px 10px 6px;margin-bottom:10px;}
  .cos-shared .ch{font-family:var(--font-display);font-size:14px;display:flex;align-items:center;gap:6px;margin-bottom:4px;}
  .cos-shared .itens{display:grid;grid-template-columns:1fr 1fr;gap:4px 10px;}
  .cos-shared .item{display:grid;grid-template-columns:40px 1fr;gap:8px;align-items:center;padding:5px 0;}
  .cos-shared .item svg{width:40px;height:40px;color:var(--ink-soft);}
  .cos-shared .nm{font-size:12.5px;font-weight:700;} .cos-shared .ds{font-size:10.5px;color:var(--ink-soft);line-height:1.35;}
  @media (max-width:820px){
    .map-cards{bottom:44px;left:8px;}
    .map-card-btn{padding:5px 11px 5px 6px;font-size:11.5px;}
    .map-overlay{left:8px;right:8px;width:auto;max-width:none;bottom:auto;top:8px;max-height:calc(100% - 64px);padding:12px 12px 10px;}
    .cos-shared .itens{grid-template-columns:1fr;}
  }

  ::-webkit-scrollbar{width:8px;} ::-webkit-scrollbar-thumb{background:var(--line-strong);border-radius:4px;}
  :focus-visible{outline:2px solid var(--clay);outline-offset:2px;}

  /* fechar das caixas "Como usar?" e "Fonte de dados" */
  .info-box{position:relative;}
  .ib-close{position:absolute;top:6px;right:8px;border:none;background:none;color:var(--header-text);font-size:20px;line-height:1;cursor:pointer;padding:4px 6px;opacity:.8;}
  .info-box > div{padding-right:18px;}
  #sheet-handle{display:none;}

  @media (max-width:820px){
    /* celular: mapa em tela cheia + painel que recolhe embaixo */
    #app{flex-direction:column;}
    #map{flex:1;height:auto;min-height:0;}
    #panel{width:100%;min-width:0;flex:none;height:72dvh;border-left:none;border-top:1px solid var(--line-strong);border-radius:16px 16px 0 0;box-shadow:0 -6px 22px rgba(0,0,0,.28);position:relative;z-index:1000;}
    body.sheet-min #panel{height:auto;}
    body.sheet-min #panel-body, body.sheet-min #map-credit{display:none;}
    #sheet-handle{display:flex;flex-direction:column;align-items:center;gap:3px;width:100%;border:none;background:var(--header-bg);color:var(--header-text);padding:7px 0 3px;font:600 11px var(--font-body);cursor:pointer;border-radius:16px 16px 0 0;opacity:.95;}
    #sheet-handle .grip{width:40px;height:4px;border-radius:3px;background:var(--header-text);opacity:.45;}
    #panel-header{padding:6px 16px 10px;}
    .tab-btn{padding:10px 2px;font-size:12px;}
    /* "Como usar?" e "Fonte de dados" viram uma janela inteira */
    #panel-header > .info-box{position:fixed;inset:12px;z-index:3000;max-height:none;margin:0;background:var(--header-bg);color:var(--header-text);padding:18px 18px 14px;font-size:13.5px;box-shadow:0 10px 40px rgba(0,0,0,.5);overflow:auto;-webkit-overflow-scrolling:touch;}
    .ib-close{position:sticky;top:0;float:right;font-size:26px;margin:-8px -8px 0 0;background:var(--header-bg);border-radius:50%;}
    #site-logo{width:34px;height:34px;}
    #panel-header h1{font-size:16px;}
    #panel-body{padding:14px 16px 20px;}
    #basemap-toggle button{padding:5px 9px;font-size:11px;}
    .country-label{font-size:17px;}
    .swipe-tag{bottom:56px;}
    .mem-popup .leaflet-popup-content{width:230px !important;}
    .mem-photo{height:96px;}
    .mem-photo svg{width:48px;height:48px;}
    .mem-body{padding:10px 12px 12px;}
    .mem-title{font-size:15px;}
    .mem-body p{font-size:12.5px;}
  }
</style>
</head>
<body>
<div id="app">
  <div id="map">
    <div id="loading"></div>
    <div id="basemap-toggle" role="group" aria-label="Mapa">
      <button data-base="sat" class="active" data-i18n="base_sat">Satélite</button>
      <button data-base="ruas" data-i18n="base_ruas">Ruas</button>
    </div>
    <div id="swipe-divider"><div id="swipe-handle" role="slider" tabindex="0" aria-label="⇆" aria-valuemin="0" aria-valuemax="100" aria-valuenow="50">⇆</div></div>
    <div class="swipe-tag" id="swipe-tag-l"></div>
    <div class="swipe-tag" id="swipe-tag-r"></div>
    <!-- janelas sobre o mapa: números e costumes -->
    <div class="map-cards" id="map-cards">
      <button class="map-card-btn" data-ov="ov-numeros"><span class="pulse" aria-hidden="true"></span><span class="mcb-ic" id="mcb-ic-num"></span><span data-i18n="btn_numeros"></span></button>
      <button class="map-card-btn" data-ov="ov-costumes"><span class="pulse" aria-hidden="true"></span><span class="mcb-ic" id="mcb-ic-cos"></span><span data-i18n="btn_costumes"></span></button>
    </div>
    <section class="map-overlay" id="ov-numeros" role="dialog" aria-labelledby="ov-numeros-t" hidden>
      <button class="ov-close" aria-label="×">×</button>
      <h3 id="ov-numeros-t" data-i18n="h_numeros"></h3>
      <div class="compare" id="compare"></div>
      <p class="src" data-i18n="compare_note"></p>
    </section>
    <section class="map-overlay" id="ov-costumes" role="dialog" aria-labelledby="ov-costumes-t" hidden>
      <button class="ov-close" aria-label="×">×</button>
      <h3 id="ov-costumes-t" data-i18n="h_costumes"></h3>
      <div id="costumes"></div>
    </section>
  </div>

  <aside id="panel">
    <!-- alça do painel no celular: abre e recolhe -->
    <button id="sheet-handle" aria-expanded="false"><span class="grip" aria-hidden="true"></span><span class="lbl"></span></button>
    <header id="panel-header">
      <div id="logo-row">
        <svg id="site-logo" viewBox="0 0 120 120" fill="none" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Logo Mirian Niz">
          <path d="M60 15 C90 15 105 45 100 70 C95 95 70 108 60 108 C50 108 25 95 20 70 C15 45 30 15 60 15 Z" stroke="currentColor" stroke-width="3.2"/>
          <path d="M60 30 C80 30 90 50 87 68 C84 86 68 96 60 96 C52 96 36 86 33 68 C30 50 40 30 60 30 Z" stroke="currentColor" stroke-width="2.4" opacity=".6"/>
          <path d="M52 48 L52 84 L68 48 L68 84" stroke="#d19468" stroke-width="5.5" stroke-linecap="round" stroke-linejoin="round"/>
        </svg>
        <div>
          <h1>Pedro Juan Caballero · Ponta Porã</h1>
          <p class="sub"><span data-i18n="sub"></span><span class="flags" id="hdr-flags"></span></p>
        </div>
      </div>
      <div id="btn-row">
        <button class="mini-btn" data-box="help-box" aria-expanded="false" data-i18n="help_btn"></button>
        <button class="mini-btn" data-box="source-box" aria-expanded="false" data-i18n="src_btn"></button>
        <div class="lang" role="group" aria-label="Idioma">
          <button data-lang="pt" title="Português">PT</button>
          <button data-lang="es" title="Español">ES</button>
        </div>
      </div>
      <div id="help-box" class="info-box" role="dialog"><button class="ib-close" aria-label="×">×</button><div data-i18n="help_html"></div></div>
      <div id="source-box" class="info-box" role="dialog"><button class="ib-close" aria-label="×">×</button><div data-i18n="src_html"></div></div>
    </header>

    <nav id="tabs" role="tablist">
      <button class="tab-btn active" data-tab="gemea" role="tab" data-i18n="tab_gemea"></button>
      <button class="tab-btn" data-tab="tempo" role="tab" data-i18n="tab_tempo"></button>
      <button class="tab-btn" data-tab="memoria" role="tab" data-i18n="tab_memoria"></button>
      <button class="tab-btn" data-tab="territorios" role="tab" data-i18n="tab_terr"></button>
    </nav>

    <div id="panel-body">

            <label><span data-i18n="sw_left"></span><select class="field sw-l"></select></label>
            <label><span data-i18n="sw_right"></span><select class="field sw-r"></select></label>
          </div>
          <button class="action-btn sw-go" data-i18n="sw_go"></button>
          <button class="action-btn ghost sw-off" data-i18n="sw_off"></button>
          <p class="src" data-i18n="sw_note"></p>
        </div>
      </section>

      <!-- ===== CAPÍTULO 2: CRESCIMENTO ===== -->
      <section class="tab-pane" id="tab-tempo">
        <h2 data-i18n="t_title"></h2>
        <p class="lead" id="tempo-lead"></p>

        <p class="src" style="margin:0 0 10px">MapBiomas · 1985–2020 · 30 m</p>

        <div class="year-box">
          <button id="play" class="play">▶</button>
          <div class="year-main">
            <div class="year" id="ano-atual">—</div>
            <input type="range" id="ano">
            <div class="ramp"><span id="ramp-a"></span><i id="ramp-bar"></i><span id="ramp-b"></span></div>
          </div>
        </div>
        <label class="switch-row"><input type="checkbox" id="mancha-on" checked> <span data-i18n="t_mancha"></span></label>

        <div id="chart" class="chart"></div>
        <details class="tbl"><summary data-i18n="t_table"></summary><div id="chart-table"></div></details>
        <div class="note" id="metodo"></div>

        <h3 data-i18n="t_fotos_h"></h3>
        <p class="lead" style="font-size:13px" data-i18n="t_fotos_lead"></p>
        <div class="swipe-box" data-l="wb2007" data-r="sat">
          <ol class="steps" data-i18n="sw_steps"></ol>
          <div class="two-sel">
            <label><span data-i18n="sw_left"></span><select class="field sw-l"></select></label>
            <label><span data-i18n="sw_right"></span><select class="field sw-r"></select></label>
          </div>
          <button class="action-btn sw-go" data-i18n="sw_go"></button>
          <button class="action-btn ghost sw-off" data-i18n="sw_off"></button>
          <p class="src" data-i18n="sw_note"></p>
        </div>
      </section>

      <!-- ===== CAPÍTULO 3 (Etapa 3) ===== -->
      <section class="tab-pane" id="tab-memoria">
        <h2 data-i18n="m_title"></h2>
        <p class="lead" data-i18n="m_lead"></p>
        <div class="chips" id="mem-chips"></div>
        <div id="mem-list"></div>
        <p class="src" id="mem-aviso"></p>

      </section>
    </div>
    <div id="map-credit"><span data-i18n="credit"></span><button id="theme-btn">◐ Tema</button></div>
  </aside>
</div>

  src_html:`<p><b>Geoportal particular</b> de Mirian Niz, para portafolio. No es un sitio oficial y no tiene vínculo con el INE (Paraguay), el IBGE (Brasil) ni ninguna municipalidad.</p>

// Ñandutí: renda paraguaia em forma de teia (desenhada por código, sempre simétrica)
function nanduti(size, cls = ''){
  const c = 24, P = (r, a) => `${(c + r * Math.cos(a)).toFixed(2)} ${(c + r * Math.sin(a)).toFixed(2)}`;
  let s = `<svg class="${cls}" viewBox="0 0 48 48" width="${size}" height="${size}" aria-hidden="true">`;
  for(let i = 0; i < 24; i++) s += `<path d="M${P(3, i * Math.PI / 12)} L${P(22, i * Math.PI / 12)}" stroke="currentColor" stroke-width=".45" opacity=".6"/>`;
  [[22, '#c4762f', 1.3], [15, '#3e5a3a', 1], [8, '#c08a3e', 1]].forEach(([r, cor, w]) => s += `<circle cx="24" cy="24" r="${r}" fill="none" stroke="${cor}" stroke-width="${w}"/>`);
  for(let i = 0; i < 12; i++){ const a = i * Math.PI / 6, d = Math.PI / 12; s += `<path d="M${P(8, a - d)} Q${P(17, a)} ${P(8, a + d)}" fill="none" stroke="#0b7398" stroke-width="1"/>`; }
  for(let i = 0; i < 16; i++){ const a = i * Math.PI / 8, d = Math.PI / 16; s += `<path d="M${P(15, a - d)} Q${P(23.5, a)} ${P(15, a + d)}" fill="none" stroke="#d52b1e" stroke-width=".9"/>`; }
  return s + `<circle cx="24" cy="24" r="3" fill="#c08a3e"/><circle cx="24" cy="24" r="1.2" fill="#d52b1e"/></svg>`;
}

// abrir e fechar as janelas sobre o mapa
function fecharJanelas(){
  document.querySelectorAll('.map-overlay').forEach(o => o.hidden = true);
  document.querySelectorAll('.map-card-btn').forEach(b => b.setAttribute('aria-expanded', 'false'));
}
document.querySelectorAll('.map-card-btn').forEach(btn => {
  try { if(localStorage.getItem('pjc-visto-' + btn.dataset.ov)) btn.classList.add('visto'); } catch(e){}
  btn.setAttribute('aria-expanded', 'false');
  btn.addEventListener('click', () => {
    const ov = document.getElementById(btn.dataset.ov), abrir = ov.hidden;
    fecharJanelas();
    if(abrir){ ov.hidden = false; btn.setAttribute('aria-expanded', 'true'); ov.querySelector('.ov-close').focus(); }
    btn.classList.add('visto');   // para de pulsar depois de aberto
    try { localStorage.setItem('pjc-visto-' + btn.dataset.ov, '1'); } catch(e){}
  });
});
document.querySelectorAll('.ov-close').forEach(b => b.addEventListener('click', fecharJanelas));
document.addEventListener('keydown', e => { if(e.key === 'Escape') fecharJanelas(); });
['map-cards', 'ov-numeros', 'ov-costumes'].forEach(id => { const el = document.getElementById(id); L.DomEvent.disableClickPropagation(el); L.DomEvent.disableScrollPropagation(el); });

function mostrarBotoesJanelas(){ document.getElementById('map-cards').style.display = activeTab === 'gemea' ? '' : 'none'; if(activeTab !== 'gemea') fecharJanelas(); }

const map = L.map('map', {zoomControl:true, minZoom:6}).setView([-22.54, -55.73], 13);

const BASES = {
  sat:  {nome: () => t('sw_cur'), make: pane => L.tileLayer('https://server.arcgisonline.com/ArcGIS/rest/services/World_Imagery/MapServer/tile/{z}/{y}/{x}', {attribution:'Imagem &copy; Esri, Maxar, Earthstar Geographics', maxZoom:19, pane})},
  ruas: {nome: () => t('ruas_nome'), make: pane => L.tileLayer('https://tile.openstreetmap.org/{z}/{x}/{y}.png', {attribution:'&copy; OpenStreetMap', maxZoom:19, pane})},
};
// Fotos antigas do Esri World Imagery Wayback com imagem diferente sobre a cidade.
// "release" = número da versão no Wayback; pt/es = data de captura no centro da cidade (metadados Esri).
const WAYBACK = [
  {key:'wb2007', release:4230,  pt:'jun/2007',  es:'jun/2007'},
  {key:'wb2014', release:13770, pt:'mar/2014',  es:'mar/2014'},
  {key:'wb2016', release:2168,  pt:'jul/2016',  es:'jul/2016'},
  {key:'wb2018', release:11351, pt:'2017–2018', es:'2017–2018'},
  {key:'wb2019', release:9181,  pt:'out/2019',  es:'oct/2019'},
  {key:'wb2021', release:15423, pt:'jan/2021',  es:'ene/2021'},
  {key:'wb2022', release:44873, pt:'abr/2022',  es:'abr/2022'},
];
WAYBACK.forEach(w => BASES[w.key] = {nome: () => t('sw_foto') + ' ' + w[LANG], wayback:true, make: pane => L.tileLayer(
  'https://wayback.maptiles.arcgis.com/arcgis/rest/services/World_Imagery/WMTS/1.0.0/default028mm/MapServer/tile/' + w.release + '/{z}/{y}/{x}',
  {attribution:'Foto ' + w.pt + ' &copy; Esri World Imagery Wayback', maxZoom:19, pane})});
const satLabels = L.tileLayer('https://server.arcgisonline.com/ArcGIS/rest/services/Reference/World_Boundaries_and_Places/MapServer/tile/{z}/{y}/{x}', {maxZoom:19, opacity:.8});
let currentBase = 'sat';
let baseLayer = BASES.sat.make('tilePane').addTo(map);
satLabels.addTo(map);

document.querySelectorAll('#basemap-toggle button').forEach(btn => btn.addEventListener('click', () => setBase(btn.dataset.base)));
function setBase(key){
  if(key === currentBase) return;
  map.removeLayer(baseLayer);
  baseLayer = BASES[key].make('tilePane').addTo(map);
  if(key === 'sat') satLabels.addTo(map); else map.removeLayer(satLabels);
  currentBase = key;
  document.querySelectorAll('#basemap-toggle button').forEach(b => b.classList.toggle('active', b.dataset.base === key));
  updateSwipeTags();
}

// ============ ABAS E CAIXAS DE AJUDA ============
let activeTab = 'gemea';

// ---- painel recolhível no celular ----
const ehCelular = () => matchMedia('(max-width:820px)').matches;
function setSheet(aberto){
  document.body.classList.toggle('sheet-min', !aberto);
  const h = document.getElementById('sheet-handle');
  h.setAttribute('aria-expanded', String(aberto));
  h.querySelector('.lbl').textContent = aberto ? t('sheet_close') : t('sheet_open');
  requestAnimationFrame(() => map.invalidateSize());   // o mapa muda de tamanho
}
const sheetAberto = () => !document.body.classList.contains('sheet-min');
// no celular, recolhe o painel para mostrar o resultado no mapa
const mostrarMapa = () => { if(ehCelular()) setSheet(false); };
document.getElementById('sheet-handle').addEventListener('click', () => setSheet(!sheetAberto()));
if(ehCelular()) document.body.classList.add('sheet-min');

document.querySelectorAll('.tab-btn').forEach(btn => btn.addEventListener('click', () => {
  if(ehCelular() && !sheetAberto()) setSheet(true);
  if(btn.dataset.tab === activeTab) return;
  activeTab = btn.dataset.tab;
  desligarCortina();   // a cortina de uma aba não continua na outra
  mostrarBotoesJanelas();
  document.querySelectorAll('.tab-btn').forEach(b => b.classList.toggle('active', b === btn));
  document.querySelectorAll('.tab-pane').forEach(p => p.classList.toggle('active', p.id === 'tab-' + btn.dataset.tab));
  if(activeTab === 'tempo') enterTempo();
  if(activeTab === 'memoria') enterMemoria();
  if(L_.territorios) refreshLayers();
}));
document.querySelectorAll('.mini-btn[data-box]').forEach(btn => btn.addEventListener('click', () => {
  const box = document.getElementById(btn.dataset.box);
  const open = !box.classList.contains('show');
  document.querySelectorAll('.info-box').forEach(b => b.classList.remove('show'));
  document.querySelectorAll('.mini-btn[data-box]').forEach(b => b.setAttribute('aria-expanded', 'false'));
  if(open){ box.classList.add('show'); btn.setAttribute('aria-expanded', 'true'); box.scrollTop = 0; box.querySelector('.ib-close').focus(); }
}));
function fecharCaixas(){
  document.querySelectorAll('.info-box').forEach(b => b.classList.remove('show'));
  document.querySelectorAll('.mini-btn[data-box]').forEach(b => b.setAttribute('aria-expanded', 'false'));
}
document.querySelectorAll('.ib-close').forEach(b => b.addEventListener('click', fecharCaixas));
document.addEventListener('keydown', e => { if(e.key === 'Escape') fecharCaixas(); });

// ============ ESTILOS DAS CAMADAS ============
const EQUIP_COR = {'Educação':'#c08a3e','Saúde':'#a5493b','Religião':'#6b5b45','Segurança':'#3e4f5c','Administração pública':'#3e5a3a','Comércio':'#d19468','Transporte':'#5e8583','Cultura':'#8a6d3b'};
const VERDE_COR = {'Praça / parque':'#5d8a3a','Esporte':'#8fb36a','Mata / vegetação':'#2f5a2a','Gramado':'#a9c294'};

function territorioStyle(f){
  const p = f.properties;
  return {fillColor: COR[p.pais], fillOpacity: p.destaque ? .10 : .05, color: p.destaque ? COR[p.pais] : '#3e5a3a', weight: p.destaque ? 2 : .9, opacity:.9};
}
const URB_FILL = {PY:'#d08a4f', BR:'#3fa9cf'};
const urbanaStyle = f => ({fillColor: URB_FILL[f.properties.pais], fillOpacity:.32, color: URB_FILL[f.properties.pais], weight:1.6, dashArray:'4 3'});
const viaStyle = f => ({color:'#f2f1e8', weight: f.properties.classe === 'principal' ? 3.2 : 2, opacity:.9});
const verdeStyle = f => ({fillColor: VERDE_COR[f.properties.tipo] || '#5d8a3a', fillOpacity:.55, color: VERDE_COR[f.properties.tipo] || '#5d8a3a', weight:.6});
const hidroStyle = f => ({color:'#5e8583', weight: f.properties.tipo === 'Rio' ? 2.6 : 1.4, opacity:.95});

// ============ CARREGAR DADOS ============
const getJSON = url => fetch(url).then(r => { if(!r.ok) throw new Error(url + ' (' + r.status + ')'); return r.json(); });
const L_ = {};               // camadas Leaflet por chave
let territorios = [], DADOS = {}, kmUrb = null, EQ_CATS = [];

Promise.all([
  getJSON('data/territorios.geojson'), getJSON('data/fronteira.geojson'), getJSON('data/area_urbana.geojson'),
  getJSON('data/vias.geojson'), getJSON('data/areas_verdes.geojson'), getJSON('data/equipamentos.geojson'),
  getJSON('data/hidrografia_urbana.geojson'), getJSON('data/limite_paraguai.geojson')
]).then(([terr, fronteira, urbana, vias, verdes, equip, hidro, paraguai]) => {
  DADOS = {terr, urbana, equip};

  L_.paraguai = L.geoJSON(paraguai, {style:{fill:false, color:'#3e5a3a', weight:1.5, opacity:.6}, interactive:false});

  L_.territorios = L.geoJSON(terr, {style: territorioStyle, onEachFeature: (f, l) => l.bindPopup(() => territorioPopup(f.properties))});
  territorios = terr.features;

  // popups: cada lado no seu idioma
  L_.urbana = L.geoJSON(urbana, {style: urbanaStyle, onEachFeature: (f, l) => l.bindPopup(() => { const p = f.properties, k = p.pais;
    return `<div class="pp-title">${ts(k, 's_area_urb')} · ${ts(k, 's_pais')}</div>
     <div class="pp-row"><b>${esc(p.nome)}</b></div>
     <div class="pp-row">${ts(k, 's_area')}: <b>${fmt1(p.area_km2)} km²</b> ${ts(k, 's_calc')}</div>
     <div class="pp-src">${ts(k, 's_fonte')}: ${ts(k, 's_urb_src')}</div>`; })});

  L_.hidroRegional = null; // carregada só quando o mapa está afastado (arquivo maior)
  L_.hidroUrbana = L.geoJSON(hidro, {style: hidroStyle, onEachFeature: (f, l) => { if(f.properties.nome) l.bindTooltip(esc(f.properties.nome), {sticky:true, className:'road-tip'}); }});

  L_.verdes = L.geoJSON(verdes, {style: verdeStyle, onEachFeature: (f, l) => l.bindPopup(() => { const p = f.properties, k = p.pais || 'BR';
    return `<div class="pp-title">${esc(p.nome || ts(k, p.tipo))}</div>
     <div class="pp-row">${ts(k, 's_tipo')}: <b>${ts(k, p.tipo)}</b> · ${ts(k, 's_pais')}</div>
     <div class="pp-src">${ts(k, 's_osm')}</div>`; })});

  L_.vias = L.geoJSON(vias, {style: viaStyle, onEachFeature: (f, l) => { if(f.properties.nome) l.bindTooltip(esc(f.properties.nome), {sticky:true, className:'road-tip'}); }});

  // equipamentos: uma camada por categoria
  EQ_CATS = Object.keys(EQUIP_COR).filter(c => equip.features.some(f => f.properties.categoria === c));
  EQ_CATS.forEach(cat => {
    L_['eq:' + cat] = L.geoJSON({type:'FeatureCollection', features: equip.features.filter(f => f.properties.categoria === cat)}, {
      pointToLayer: (f, ll) => L.circleMarker(ll, {radius:5.5, fillColor: EQUIP_COR[cat], fillOpacity:.95, color:'#fff', weight:1.5}),
      onEachFeature: (f, l) => l.bindPopup(() => { const p = f.properties, k = p.pais || 'BR';
        return `<div class="pp-title">${esc(p.nome || ts(k, 's_sem_nome'))}</div>
         <div class="pp-row"><b>${ts(k, 'tp_' + p.tipo)}</b> · ${ts(k, cat)} · ${ts(k, 's_pais')}</div>
         <div class="pp-src">${ts(k, 's_osm')}</div>`; })
    });
  });

  // fronteira: contorno branco por baixo + linha terracota por cima
  const fUrb = {type:'FeatureCollection', features: fronteira.features.filter(f => f.properties.trecho === 'urbano')};
  const fRur = {type:'FeatureCollection', features: fronteira.features.filter(f => f.properties.trecho === 'rural')};
  kmUrb = fUrb.features[0].properties.km;
  const fronteiraPopup = tr => `<div class="pp-title">${t('fr_title')}</div>
     <div class="pp-row">${tr === 'urbano' ? t('fr_urb', {km: fmt1(kmUrb) + ' km'}) : t('fr_rur')}</div>
     <div class="pp-src">${t('fr_src')}</div>`;
  L_.fronteira = L.featureGroup([
    L.geoJSON(fRur, {style:{color:'#fff', weight:5, opacity:.6}, interactive:false}),
    L.geoJSON(fRur, {style:{color:'#b9744a', weight:2.5, dashArray:'8 6'}}).bindPopup(() => fronteiraPopup('rural')),
    L.geoJSON(fUrb, {style:{color:'#fff', weight:9, opacity:.85}, interactive:false}),
    L.geoJSON(fUrb, {style:{color:'#b9744a', weight:5}}).bindPopup(() => fronteiraPopup('urbano')),
  ]);
  L_.fronteiraUrbBounds = L.geoJSON(fUrb).getBounds();

  // rótulos dos países: cada um no seu idioma (aparecem só de perto)
  L_.rotulos = L.layerGroup([
    L.marker([-22.566, -55.748], {icon: L.divIcon({className:'', html:'<div class="country-label py">' + FLAG.PY + 'Paraguay</div>', iconSize:null}), interactive:false}),
    L.marker([-22.516, -55.704], {icon: L.divIcon({className:'', html:'<div class="country-label br">' + FLAG.BR + 'Brasil</div>', iconSize:null}), interactive:false}),
  ]);

  applyLang(LANG);
  map.fitBounds(L_.fronteiraUrbBounds, {padding:[30,30]});
  document.getElementById('loading').style.display = 'none';
}).catch(err => {
  const ld = document.getElementById('loading'); ld.dataset.err = 1; ld.textContent = t('err') + err.message;
  console.error(err);
});

function territorioPopup(p){
  const k = p.pais, pct = Math.round(p.pop_urb / p.pop * 100);
  return `<div class="pp-title">${esc(p.nome)} <span class="flag ${k.toLowerCase()}">${k}</span></div>
    <div class="pp-row">${p.unidade} · ${esc(p.dep)}</div>
    <div class="pp-row">${ts(k, 's_pop22')}: <b>${fmt(p.pop)}</b></div>
    <div class="pp-row">${ts(k, 's_urbana')}: <b>${fmt(p.pop_urb)}</b> (${pct}%) · ${ts(k, 's_rural')}: <b>${fmt(p.pop_rur)}</b></div>
    <div class="pp-row">${ts(k, 's_area')}: <b>${fmt1(p.area_km2)} km²</b> ${p.area_oficial ? ts(k, 's_oficial') : ts(k, 's_calc')}</div>

}

const LAYERS = [
  {key:'fronteira', on:true, keyHtml: () => `<span><i class="ln" style="border-color:#b9744a"></i>${t('lyk_fronteira')}</span>`},
  {key:'urbana', on:true, keyHtml: () => `<span><i style="background:#d08a4faa"></i>Paraguay</span><span><i style="background:#3fa9cfaa"></i>Brasil</span>`},

  {key:'vias', on:false, keyHtml: () => `<span><i class="ln" style="border-color:#c9c2a8"></i>${t('lyk_vias')}</span>`},

const layerOn = {};
LAYERS.forEach(l => { if(!l.grupo) layerOn[l.key] = l.on; });
function buildLayerList(){
  EQ_CATS.forEach(c => { if(!('eq:' + c in layerOn)) layerOn['eq:' + c] = false; });
  const cnt = (c, k) => DADOS.equip.features.filter(f => f.properties.categoria === c && f.properties.pais === k).length;

          <span class="dot" style="background:${EQUIP_COR[c]}"></span><span class="st">${t(c)}<span class="sd">${t('d_' + c)}</span></span><span class="cnt">PY ${cnt(c, 'PY')} · BR ${cnt(c, 'BR')}</span></label>`).join('')}</div>
      </div>`
    : `<label class="layer"><input type="checkbox" data-layer="${l.key}" ${layerOn[l.key] ? 'checked' : ''}>
        <span class="txt"><span class="name">${t('ly_' + l.key)}</span><div class="meta">${t('lym_' + l.key)}</div><div class="key">${l.keyHtml()}</div></span></label>`).join('');
  box.querySelectorAll('input[data-layer]').forEach(inp => inp.addEventListener('change', () => { layerOn[inp.dataset.layer] = inp.checked; syncEquipAll(); refreshLayers(); }));

    refreshLayers();
  });
  syncEquipAll();
  refreshLayers();
}
function syncEquipAll(){
  const all = document.getElementById('equip-all'); if(!all) return;
  const n = EQ_CATS.filter(c => layerOn['eq:' + c]).length;
  all.checked = n === EQ_CATS.length; all.indeterminate = n > 0 && n < EQ_CATS.length;
}
// ordem de desenho: de baixo para cima
const ORDER = () => ['territorios', 'urbana', 'verdes', 'crescimento', 'janela', 'hidro', 'vias', ...EQ_CATS.map(c => 'eq:' + c), 'fronteira', 'memoria'];
const soCap1 = k => ['urbana', 'verdes', 'vias'].includes(k) || k.startsWith('eq:');   // temáticas do capítulo 1
function refreshLayers(){
  const z = map.getZoom();
  ORDER().forEach(k => {
    if(k === 'hidro') return refreshHidro(z);
    const lyr = L_[k]; if(!lyr) return;
    let on = layerOn[k];
    if(k === 'memoria') on = activeTab === 'memoria';
    else if(k === 'crescimento' || k === 'janela') on = activeTab === 'tempo' && (k === 'janela' || manchaOn);
    else if((activeTab === 'tempo' || activeTab === 'memoria') && soCap1(k)) on = false;
    if(k === 'urbana' && swipeKey) on = false;   // não cobrir as fotos durante a comparação
    if(on) { if(!map.hasLayer(lyr)) lyr.addTo(map); } else map.removeLayer(lyr);
  });
  ORDER().forEach(k => { const lyr = L_[k]; if(lyr && map.hasLayer(lyr)) lyr.bringToFront(); });
  if(z >= 12) L_.rotulos.addTo(map); else map.removeLayer(L_.rotulos);
  if(L_.paraguai){ if(z < 9) L_.paraguai.addTo(map); else map.removeLayer(L_.paraguai); }
}
let hidroLoading = false;
function refreshHidro(z){
  const perto = z >= 12;
  if(layerOn.hidro && perto) L_.hidroUrbana.addTo(map); else map.removeLayer(L_.hidroUrbana);
  if(layerOn.hidro && !perto){
    if(L_.hidroRegional) L_.hidroRegional.addTo(map);
    else if(!hidroLoading){
      hidroLoading = true;
      getJSON('data/cursos_dagua.geojson').then(d => {
        L_.hidroRegional = L.geoJSON(d, {style:{color:'#5e8583', weight:1, opacity:.85}, onEachFeature:(f,l) => { if(f.properties.nome) l.bindTooltip(esc(f.properties.nome), {sticky:true, className:'road-tip'}); }});
        refreshLayers();
      });
    }
  } else if(L_.hidroRegional) map.removeLayer(L_.hidroRegional);
}
map.on('zoomend', () => { if(L_.territorios) refreshLayers(); });

// ============ PAINEL DE COMPARAÇÃO (coluna PY em espanhol, coluna BR em português) ============
function buildCompare(){
  const t_ = {}; DADOS.terr.features.filter(f => f.properties.destaque).forEach(f => t_[f.properties.pais] = f.properties);
  const u = {}; DADOS.urbana.features.forEach(f => u[f.properties.pais] = f.properties);
  const rows = [
    {lbl:'s_pop_total', v: k => t_[k].pop, f: fmt, unit:'s_hab'},
    {lbl:'s_pop_urb', v: k => t_[k].pop_urb, f: fmt, unit:'s_hab', extra: k => ` <span class="unit">(${Math.round(t_[k].pop_urb / t_[k].pop * 100)}%)</span>`},
    {lbl:'s_area_urb', v: k => u[k].area_km2, f: fmt1, unit:'km²'},
    {lbl:'s_dens', v: k => t_[k].pop_urb / u[k].area_km2, f: x => fmt(Math.round(x)), unit:'hab./km²'},
    {lbl:'s_area_terr', v: k => t_[k].area_km2, f: x => fmt(Math.round(x)), unit:'km²'},
  ];
  let html = `<div class="row head"><div class="cell py">${esc(t_.PY.nome)}<small>${FLAG.PY} Paraguay</small></div><div class="cell br">${esc(t_.BR.nome)}<small>${FLAG.BR} Brasil</small></div></div>`;
  rows.forEach(r => {
    const max = Math.max(r.v('PY'), r.v('BR'));
    const cell = k => `<div class="cell"><div class="clbl">${ts(k, r.lbl)}</div><span class="val">${r.f(r.v(k))}</span><span class="unit">${ts(k, r.unit)}</span>${r.extra ? r.extra(k) : ''}
       <div class="bar"><span style="width:${(r.v(k) / max * 100).toFixed(1)}%;background:var(--${k.toLowerCase()})"></span></div></div>`;
    html += `<div class="row">${cell('PY')}${cell('BR')}</div>`;
  });
  document.getElementById('compare').innerHTML = html;
}

// A foto da direita fica numa camada própria, recortada a partir da linha divisória.
const mapEl = document.getElementById('map');
const swipePane = map.getPane('swipePane');
let swipeLayer = null, swipeKey = null, swipeX = .5;
function setSwipe(rightKey){
  if(swipeLayer){ map.removeLayer(swipeLayer); swipeLayer = null; }
  swipeKey = rightKey;
  mapEl.classList.toggle('swipe-on', !!rightKey);
  if(rightKey) swipeLayer = BASES[rightKey].make('swipePane').addTo(map);
  if(L_.territorios) refreshLayers();
  updateSwipeTags(); updateClip();
}
function desligarCortina(){
  if(swipeKey) setSwipe(null);
  if(BASES[currentBase].wayback) setBase('sat');
}
function updateSwipeTags(){
  document.getElementById('swipe-tag-l').textContent = '◀ ' + BASES[currentBase].nome();
  document.getElementById('swipe-tag-r').textContent = swipeKey ? BASES[swipeKey].nome() + ' ▶' : '';
}
function updateClip(){
  if(!swipeLayer) return;
  const size = map.getSize();
  const nw = map.containerPointToLayerPoint([0, 0]);
  const se = map.containerPointToLayerPoint(size);
  const x = map.containerPointToLayerPoint([swipeX * size.x, 0]).x;
  swipePane.style.clip = `rect(${nw.y}px, ${se.x}px, ${se.y}px, ${x}px)`;
  document.getElementById('swipe-divider').style.left = (swipeX * 100) + '%';
  document.getElementById('swipe-handle').setAttribute('aria-valuenow', Math.round(swipeX * 100));
}
map.on('move zoom resize zoomend', updateClip);
const handle = document.getElementById('swipe-handle');
handle.addEventListener('pointerdown', e => {
  e.preventDefault(); e.stopPropagation(); handle.setPointerCapture(e.pointerId); map.dragging.disable();
  const move = ev => { const r = mapEl.getBoundingClientRect(); swipeX = Math.min(.98, Math.max(.02, (ev.clientX - r.left) / r.width)); updateClip(); };
  const up = () => { handle.removeEventListener('pointermove', move); handle.removeEventListener('pointerup', up); handle.removeEventListener('pointercancel', up); map.dragging.enable(); };
  handle.addEventListener('pointermove', move); handle.addEventListener('pointerup', up); handle.addEventListener('pointercancel', up);
});
handle.addEventListener('keydown', e => {
  if(e.key === 'ArrowLeft') { swipeX = Math.max(.02, swipeX - .05); updateClip(); }
  if(e.key === 'ArrowRight') { swipeX = Math.min(.98, swipeX + .05); updateClip(); }
});
L.DomEvent.disableClickPropagation(document.getElementById('swipe-divider'));

// ============ CAPÍTULO 2: CRESCIMENTO URBANO ============
const FONTES = {
  mapbiomas: {nome:'MapBiomas', arquivo:'data/crescimento_mapbiomas.geojson'},
};
let crescInfo = null, fonteAtual = 'mapbiomas', anoAtual = null, manchaOn = true, tempoIniciado = false;
const crescCache = {};

// rampa sequencial (um só tom terroso, escuro = antigo -> claro = recente)
const RAMPA = ['#4a2410', '#8a4b22', '#c4762f', '#e8b06a', '#f7e2a8'];
function corAno(ano, a0, a1){
  const p = (a1 === a0 ? 1 : (ano - a0) / (a1 - a0)) * (RAMPA.length - 1);
  const i = Math.min(Math.floor(p), RAMPA.length - 2), f = p - i;
  const h = c => [1, 3, 5].map(k => parseInt(c.slice(k, k + 2), 16));
  const [a, b] = [h(RAMPA[i]), h(RAMPA[i + 1])];
  return '#' + a.map((v, k) => Math.round(v + (b[k] - v) * f).toString(16).padStart(2, '0')).join('');
}

function enterTempo(){
  if(tempoIniciado) return;
  tempoIniciado = true;
  getJSON('data/crescimento_areas.json').then(info => {
    crescInfo = info;
    const [x0, y0, x1, y1] = info.janela;
    L_.janela = L.rectangle([[y0, x0], [y1, x1]], {fill:false, color:'#f2f1e8', weight:1.5, dashArray:'6 5', opacity:.9, interactive:false});
    map.flyToBounds(L_.janela.getBounds(), {padding:[10, 10]});
    setFonte('mapbiomas');
  });
}
function textosTempo(){
  if(!crescInfo) return;
  const d = crescInfo[fonteAtual], anos = d.anos, n = anos.length - 1;
  document.getElementById('metodo').innerHTML = t('met_' + fonteAtual);
  document.getElementById('tempo-lead').innerHTML = t('t_lead', {
    py0: fmt1(d.area_km2.PY[0]), py1: fmt1(d.area_km2.PY[n]), br0: fmt1(d.area_km2.BR[0]), br1: fmt1(d.area_km2.BR[n]),
    a0: anos[0], a1: anos[n], fonte: FONTES[fonteAtual].nome});
  playBtn.setAttribute('aria-label', timer ? t('t_pause') : t('t_play'));
  document.getElementById('ano').setAttribute('aria-label', t('t_ano'));
  drawChart();
}
function setFonte(src){
  fonteAtual = src;
  const anos = crescInfo[src].anos;
  const slider = document.getElementById('ano');
  slider.min = anos[0]; slider.max = anos[anos.length - 1]; slider.step = 1;
  anoAtual = anos[anos.length - 1]; slider.value = anoAtual;
  document.getElementById('ramp-a').textContent = anos[0];
  document.getElementById('ramp-b').textContent = anos[anos.length - 1];
  document.getElementById('ramp-bar').style.background = `linear-gradient(90deg, ${RAMPA.join(',')})`;
  textosTempo();
  carregarMancha(src);
}
function carregarMancha(src){
  const pronto = gj => {
    if(fonteAtual !== src) return;
    if(L_.crescimento) map.removeLayer(L_.crescimento);
    const anos = crescInfo[src].anos;
    L_.crescimento = L.geoJSON(gj, {style: f => estiloMancha(f, anos), onEachFeature:(f, l) => l.bindTooltip(() => t('t_desde', {ano: f.properties.ano}) + ' (' + FONTES[src].nome + ')', {sticky:true, className:'road-tip'})});
    refreshLayers(); atualizarAno();
  };
  if(crescCache[src]) pronto(crescCache[src]);
  else getJSON(FONTES[src].arquivo).then(gj => { crescCache[src] = gj; pronto(gj); });
}
function estiloMancha(f, anos){
  const a = f.properties.ano, vis = a <= anoAtual;
  return {fillColor: corAno(a, anos[0], anos[anos.length - 1]), fillOpacity: vis ? .82 : 0, stroke: vis && a === anoAtual, color:'#ffffff', weight:1.2, opacity:.95};
}
function atualizarAno(){
  document.getElementById('ano-atual').textContent = anoAtual;
  if(L_.crescimento){ const anos = crescInfo[fonteAtual].anos; L_.crescimento.setStyle(f => estiloMancha(f, anos)); }
  drawChart();
}
document.getElementById('ano').addEventListener('input', e => { pararAnimacao(); anoAtual = +e.target.value; atualizarAno(); });
document.getElementById('mancha-on').addEventListener('change', e => { manchaOn = e.target.checked; refreshLayers(); });

// animação
let timer = null;
const playBtn = document.getElementById('play');
function pararAnimacao(){ if(timer){ clearInterval(timer); timer = null; playBtn.textContent = '▶'; playBtn.setAttribute('aria-label', t('t_play')); } }
playBtn.addEventListener('click', () => {
  if(timer) return pararAnimacao();
  if(!manchaOn){ manchaOn = true; document.getElementById('mancha-on').checked = true; refreshLayers(); }
  const anos = crescInfo[fonteAtual].anos;
  let i = anoAtual >= anos[anos.length - 1] ? 0 : anos.indexOf(anoAtual) + 1;
  playBtn.textContent = '❚❚'; playBtn.setAttribute('aria-label', t('t_pause'));

});

// gráfico de linhas (SVG): área urbana por ano, um eixo, duas séries
function drawChart(){
  if(!crescInfo) return;
  const d = crescInfo[fonteAtual], anos = d.anos, box = document.getElementById('chart');
  const W = Math.max(280, box.clientWidth || 340), H = 200, m = {l:30, r:58, t:20, b:22};
  const ymax = Math.ceil(Math.max(...d.area_km2.PY, ...d.area_km2.BR) / 10) * 10;
  const X = a => m.l + (a - anos[0]) / (anos[anos.length - 1] - anos[0]) * (W - m.l - m.r);
  const Y = v => H - m.b - v / ymax * (H - m.t - m.b);
  const ticksY = []; for(let v = 0; v <= ymax; v += 10) ticksY.push(v);
  const passoX = 10;
  const ticksX = anos.filter(a => (a - anos[0]) % passoX === 0);
  const linha = k => anos.map((a, i) => `${i ? 'L' : 'M'}${X(a).toFixed(1)},${Y(d.area_km2[k][i]).toFixed(1)}`).join('');
  const iA = anos.indexOf(anoAtual), ult = anos.length - 1;
  // evita rótulos finais sobrepostos
  let yPY = Y(d.area_km2.PY[ult]), yBR = Y(d.area_km2.BR[ult]);
  if(Math.abs(yPY - yBR) < 13){ const mid = (yPY + yBR) / 2, s = yPY <= yBR ? -1 : 1; yPY = mid + s * 7; yBR = mid - s * 7; }
  box.innerHTML = `<svg viewBox="0 0 ${W} ${H}" role="img" aria-label="${t('t_chart_aria')}">
    ${ticksY.map(v => `<line class="grid" x1="${m.l}" x2="${W - m.r}" y1="${Y(v)}" y2="${Y(v)}"/><text class="axis" x="${m.l - 6}" y="${Y(v) + 4}" text-anchor="end">${v}</text>`).join('')}
    ${ticksX.map(a => `<text class="axis" x="${X(a)}" y="${H - 5}" text-anchor="middle">${a}</text>`).join('')}
    <text class="axis" x="${m.l - 6}" y="8" text-anchor="end" style="font-size:10px">km²</text>
    ${iA >= 0 ? `<line class="cursor" x1="${X(anoAtual)}" x2="${X(anoAtual)}" y1="${m.t}" y2="${H - m.b}"/>` : ''}
    <path d="${linha('PY')}" fill="none" stroke="var(--py)" stroke-width="2" stroke-linejoin="round" stroke-linecap="round"/>
    <path d="${linha('BR')}" fill="none" stroke="var(--br)" stroke-width="2" stroke-linejoin="round" stroke-linecap="round"/>
    ${iA >= 0 ? ['PY', 'BR'].map(k => `<circle cx="${X(anoAtual)}" cy="${Y(d.area_km2[k][iA])}" r="4.5" fill="var(--${k.toLowerCase()})" stroke="var(--panel)" stroke-width="2"/>`).join('') : ''}
    <text class="end" x="${X(anos[ult]) + 8}" y="${yPY + 4}">PY ${fmt1(d.area_km2.PY[ult])}</text>
    <text class="end" x="${X(anos[ult]) + 8}" y="${yBR + 4}">BR ${fmt1(d.area_km2.BR[ult])}</text>
    <rect class="hit" x="${m.l}" y="${m.t}" width="${W - m.l - m.r}" height="${H - m.t - m.b}" fill="transparent"/>
  </svg><div class="chart-tip"></div>`;
  const svg = box.querySelector('svg'), tip = box.querySelector('.chart-tip'), hit = box.querySelector('.hit');
  const mostrar = ev => {
    const r = svg.getBoundingClientRect(), px = (ev.clientX - r.left) * W / r.width;
    let i = 0, best = 1e9; anos.forEach((a, j) => { const dd = Math.abs(X(a) - px); if(dd < best){ best = dd; i = j; } });
    tip.innerHTML = `<b>${anos[i]}</b><br><i style="background:var(--py)"></i>Paraguay: ${fmt1(d.area_km2.PY[i])} km²<br><i style="background:var(--br)"></i>Brasil: ${fmt1(d.area_km2.BR[i])} km²`;
    tip.style.display = 'block';
    const left = X(anos[i]) / W * r.width;
    tip.style.left = Math.min(Math.max(0, left - 70), r.width - 150) + 'px'; tip.style.top = '-6px';
  };
  hit.addEventListener('pointermove', mostrar);
  hit.addEventListener('pointerleave', () => tip.style.display = 'none');
  hit.addEventListener('click', mostrar);
  document.getElementById('chart-table').innerHTML = `<table><tr><th>${t('t_ano')}</th><th>Paraguay (km²)</th><th>Brasil (km²)</th></tr>${anos.map((a, i) => `<tr><td>${a}</td><td>${fmt1(d.area_km2.PY[i])}</td><td>${fmt1(d.area_km2.BR[i])}</td></tr>`).join('')}</table>`;
}
window.addEventListener('resize', () => { if(activeTab === 'tempo') drawChart(); });

// ============ CAPÍTULO 3: MEMÓRIA E CULTURA ============
// Os lugares vêm da planilha data/memoria/lugares.csv (editável no Excel, Google Planilhas ou QGIS).
const MEM_CAT = {
  historia:  {cor:'#8a3b22', g:'<path d="M4 9h16L12 4z"/><path d="M7 9v10M12 9v10M17 9v10M5 20h14"/>'},
  marco:     {cor:'#c4762f', g:'<path d="M6 21V3M6 4h11l-2.5 3.5L17 11H6"/>'},
  natureza:  {cor:'#4f7a3a', g:'<path d="M12 3 6.5 12h3.5L7 17h10l-3-5h3.5z"/><path d="M12 17v4"/>'},
  fe:        {cor:'#6b5b45', g:'<path d="M12 2v5M10 4h4M7 21v-9l5-5 5 5v9zM10.5 21v-4h3v4"/>'},
  movimento: {cor:'#0b7398', g:'<path d="M5 8h14l-1 12H6z"/><path d="M9 8V6a3 3 0 0 1 6 0v2"/>'},
  memoria:   {cor:'#b07a2a', g:'<circle cx="12" cy="13" r="7"/><path d="M12 9v4l2.5 2M9 3h6"/>'},
  infancia: {cor:'#c4762f', g:'<path d="M12 3 18 10 12 17 6 10z"/><path d="M6 10h12M12 3v14"/><path d="M12 17q-1.5 2.5.5 4.5"/>'},
  praca:    {cor:'#4f7a3a', g:'<circle cx="12" cy="8" r="4.5"/><path d="M12 12.5V20M6 17h12M7 17v3M17 17v3"/>'},
  feira:    {cor:'#b07a2a', g:'<path d="M4 9h16l-1.6-4H5.6z"/><path d="M4 9q2 2.5 4 0 2 2.5 4 0 2 2.5 4 0 2 2.5 4 0M6 11v9M18 11v9M6 15h12"/>'},
  escola:   {cor:'#0b7398', g:'<path d="M4 6q4-2 8 0v13q-4-2-8 0zM12 6q4-2 8 0v13q-4-2-8 0z"/>'},
  igreja:   {cor:'#8a3b22', g:'<path d="M12 2v5M10 4h4M7 21v-9l5-5 5 5v9zM10.5 21v-4h3v4"/>'},
  outro:    {cor:'#3e5a3a', g:'<path d="M12 20s-7-4.5-7-9.5A3.8 3.8 0 0 1 12 8a3.8 3.8 0 0 1 7 2.5C19 15.5 12 20 12 20z"/>'},
};
const glifo = (cat, cor = '#fff') => `<svg viewBox="0 0 24 24" fill="none" stroke="${cor}" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">${MEM_CAT[cat].g}</svg>`;
let memLugares = null, memFiltro = 'todos', memIniciado = false;

// leitor de CSV simples: aceita ; ou , como separador, aspas e acentos (UTF-8)
function lerCSV(txt){
  txt = txt.replace(/^﻿/, '');
  const prim = txt.split(/\r?\n/)[0];
  const sep = (prim.match(/;/g) || []).length >= (prim.match(/,/g) || []).length ? ';' : ',';
  const rows = []; let row = [], cell = '', q = false;
  for(let i = 0; i < txt.length; i++){
    const ch = txt[i];
    if(q){ if(ch === '"'){ if(txt[i + 1] === '"'){ cell += '"'; i++; } else q = false; } else cell += ch; }
    else if(ch === '"') q = true;
    else if(ch === sep){ row.push(cell); cell = ''; }
    else if(ch === '\n'){ row.push(cell); rows.push(row); row = []; cell = ''; }
    else if(ch !== '\r') cell += ch;
  }
  if(cell || row.length){ row.push(cell); rows.push(row); }
  const ALIAS = {nome:'nome_pt', descricao:'descricao_pt', latitude:'lat', longitude:'lon', long:'lon', lng:'lon'};
  const head = rows.shift().map(h => { const k = semAcento(h.trim()).replace(/\s+/g, '_'); return ALIAS[k] || k; });
  return rows.filter(r => r.some(c => c.trim())).map(r => Object.fromEntries(head.map((h, i) => [h, (r[i] ?? '').trim()])));
}
const num = s => parseFloat(String(s).replace(',', '.'));

// enquadra os lugares da cidade (Cerro Corá, a ~40 km, fica acessível pela lista)
function enquadrarMemoria(){
  const perto = memLugares.filter(l => Math.abs(l.lat + 22.54) < .12 && Math.abs(l.lon + 55.725) < .12);
  const pts = (perto.length ? perto : memLugares).map(l => [l.lat, l.lon]);
  if(pts.length) map.flyToBounds(L.latLngBounds(pts), {padding:[50, 50], maxZoom:15});
}
function enterMemoria(){
  if(memIniciado){ if(L_.memoria && L_.memoria.getLayers().length) enquadrarMemoria(); return; }
  memIniciado = true;
  fetch('data/memoria/lugares.csv', {cache:'no-cache'}).then(r => { if(!r.ok) throw new Error(r.status); return r.text(); }).then(txt => {
    let ignorados = 0;
    memLugares = lerCSV(txt).map(l => {
      let lat = num(l.lat), lon = num(l.lon);
      if(lat < -40 && lon > -40) [lat, lon] = [lon, lat];   // latitude e longitude trocadas
      if(!isFinite(lat) || !isFinite(lon)){ ignorados++; return null; }
      const cat = MEM_CAT[semAcento(l.categoria || '')] ? semAcento(l.categoria) : 'outro';
      return {...l, lat, lon, cat, ex: /^(sim|si|x|1|yes|true)$/i.test(semAcento(l.exemplo || ''))};
    }).filter(Boolean);
    document.getElementById('mem-aviso').textContent = ignorados ? t('m_ignorados', {n: ignorados}) : '';
    L_.memoria = L.featureGroup(memLugares.map((l, i) => {
      const m = L.marker([l.lat, l.lon], {icon: L.divIcon({className:'', html:`<div class="mem-pin${l.ex ? ' ex' : ''}" style="--c:${MEM_CAT[l.cat].cor}">${glifo(l.cat)}</div>`, iconSize:[32, 32], iconAnchor:[16, 36], popupAnchor:[0, -34]}), title: memNome(l)});
      m.bindPopup(() => memCartao(l), {className:'mem-popup', maxWidth:270, maxHeight: Math.max(240, map.getSize().y - 110), autoPanPaddingTopLeft:[56, 64], autoPanPaddingBottomRight:[12, 12]});
      l.marker = m; return m;
    }));
    buildMemoria(); refreshLayers();
    if(memLugares.length) enquadrarMemoria();
  }).catch(() => { document.getElementById('mem-list').innerHTML = `<div class="soon-box">${t('m_err')}</div>`; });
}
// texto no idioma escolhido; se faltar, usa o outro idioma
const memNome = l => (LANG === 'es' ? l.nome_es || l.nome_pt : l.nome_pt || l.nome_es) || '—';
const memDesc = l => (LANG === 'es' ? l.descricao_es || l.descricao_pt : l.descricao_pt || l.descricao_es) || '';
const dominio = u => { try { return new URL(u).hostname.replace(/^www\./, ''); } catch(e){ return u; } };
// só aceita links http(s) vindos da planilha
const linkSeguro = (u, txt) => /^https?:\/\//i.test(u) ? `<a href="${esc(u)}" target="_blank" rel="noopener">${esc(txt)}</a>` : esc(txt);
const fotoSrc = f => /^https?:\/\//.test(f) ? f : 'data/memoria/fotos/' + encodeURIComponent(f);
function semFoto(tam){ return `${nanduti(tam)}<span>${t('m_foto_breve')}</span>`; }
function memCartao(l){
  const foto = l.foto ? `<img src="${esc(fotoSrc(l.foto))}" alt="${esc(memNome(l))}" loading="lazy" onload="if(this.naturalHeight > this.naturalWidth) this.style.objectPosition = 'center 12%'" onerror="this.parentNode.innerHTML=semFoto(64)">` : semFoto(64);
  return `<div class="mem-photo">${foto}${l.ex ? `<span class="tag-ex">${t('m_exemplo')}</span>` : ''}</div>
    <div class="mem-body">
      <span class="mem-chip" style="--c:${MEM_CAT[l.cat].cor}">${glifo(l.cat)} ${t('cat_' + l.cat)}</span>
      <div class="mem-title">${esc(memNome(l))}</div>
      ${l.ano ? `<div class="mem-ano">${esc(l.ano)}</div>` : ''}
      ${memDesc(l) ? `<p>${esc(memDesc(l)).replace(/\n/g, '<br>')}</p>` : ''}
      ${l.fonte ? `<div class="mem-cred">${t('m_fonte')}: ${linkSeguro(l.fonte, dominio(l.fonte))}</div>` : ''}
      ${l.foto && l.credito_foto ? `<div class="mem-cred">${t('m_foto_de')}: ${(c => l.foto_link ? linkSeguro(l.foto_link, c) : esc(c))(l.credito_foto.replace(/Public domain/i, LANG === 'es' ? 'Dominio público' : 'Domínio público'))}</div>` : ''}
    </div>`;
}
function buildMemoria(){
  if(!memLugares) return;
  const cats = Object.keys(MEM_CAT).filter(c => memLugares.some(l => l.cat === c));
  if(memFiltro !== 'todos' && !cats.includes(memFiltro)) memFiltro = 'todos';
  document.getElementById('mem-chips').innerHTML = `<button class="chip${memFiltro === 'todos' ? ' active' : ''}" data-cat="todos">${t('m_all')}</button>` +
    cats.map(c => `<button class="chip${memFiltro === c ? ' active' : ''}" data-cat="${c}">${glifo(c, MEM_CAT[c].cor)}${t('cat_' + c)}</button>`).join('');
  document.querySelectorAll('#mem-chips .chip').forEach(b => b.addEventListener('click', () => { memFiltro = b.dataset.cat; buildMemoria(); }));
  const vis = memLugares.filter(l => memFiltro === 'todos' || l.cat === memFiltro);
  memLugares.forEach(l => { const on = vis.includes(l); if(on && !L_.memoria.hasLayer(l.marker)) L_.memoria.addLayer(l.marker); if(!on) L_.memoria.removeLayer(l.marker); });
  document.getElementById('mem-list').innerHTML = vis.length ? vis.map((l, i) => `<div class="mem-item" tabindex="0" role="button" data-i="${memLugares.indexOf(l)}">
      <div class="mem-thumb">${l.foto ? `<img src="${esc(fotoSrc(l.foto))}" alt="" loading="lazy" onerror="this.parentNode.innerHTML=nanduti(40)">` : nanduti(40)}</div>
      <div><div class="nm">${esc(memNome(l))}</div><div class="mt"><span style="color:${MEM_CAT[l.cat].cor}">●</span>${t('cat_' + l.cat)}${l.ano ? ' · ' + esc(l.ano) : ''}${l.ex ? ` <span class="tag-ex">${t('m_exemplo')}</span>` : ''}</div></div></div>`).join('')
    : `<div class="soon-box">${t('m_vazio')}</div>`;
  document.querySelectorAll('.mem-item').forEach(el => {
    const go = () => { mostrarMapa(); const l = memLugares[+el.dataset.i]; map.flyTo([l.lat, l.lon], Math.max(map.getZoom(), 16)); map.once('moveend', () => l.marker.openPopup()); };
    el.addEventListener('click', go);
    el.addEventListener('keydown', e => { if(e.key === 'Enter' || e.key === ' '){ e.preventDefault(); go(); } });
  });
}

// ============ IDIOMA ============
function applyLang(lang){
  LANG = lang;
  try { localStorage.setItem('pjc-lang', lang); } catch(e){}
  document.documentElement.lang = lang === 'es' ? 'es' : 'pt-BR';
  document.querySelectorAll('[data-i18n]').forEach(el => el.innerHTML = t(el.dataset.i18n));
  const ld = document.getElementById('loading'); if(ld.style.display !== 'none' && !ld.dataset.err) ld.innerHTML = `<div class="box">${nanduti(84, 'spin')}<span>${t('loading')}</span></div>`;
  document.querySelectorAll('[data-i18n-ph]').forEach(el => el.placeholder = t(el.dataset.i18nPh));
  document.querySelectorAll('.lang button').forEach(b => b.classList.toggle('active', b.dataset.lang === lang));
  document.querySelectorAll('#basemap-toggle button').forEach(b => b.classList.toggle('active', b.dataset.base === currentBase));
  fillSwipeBoxes(); updateSwipeTags(); buildCostumes(); setSheet(sheetAberto());
  map.closePopup();
  if(L_.territorios){
    document.getElementById('g-lead').innerHTML = t('g_lead', {km: fmt1(kmUrb) + ' km'});
    buildLayerList(); buildCompare(); renderList();
  }
  textosTempo();
  buildMemoria();
}
document.querySelectorAll('.lang button').forEach(b => b.addEventListener('click', () => applyLang(b.dataset.lang)));
applyLang(LANG);   // textos já aparecem antes de os dados carregarem
</script>
